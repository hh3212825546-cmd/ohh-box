<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>切片幻影 - OHH BOX</title>
    <link rel="stylesheet" href="../dot-collage/style.css">
    <style>
        .color-palette { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
        .color-item { position: relative; width: 34px; height: 34px; border-radius: 50%; border: 2px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.1); cursor: pointer; }
        .color-del { position: absolute; top: -5px; right: -5px; width: 16px; height: 16px; background: #ef4444; color: white; border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 1px solid white; }
        .btn-eyedropper { background: #f1f5f9; border: 1px solid var(--border); border-radius: 50%; width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: 0.2s; }
        .btn-eyedropper:hover { background: #e2e8f0; }
        .preview-area { background: #000; }
        canvas { touch-action: none; cursor: crosshair; }
    </style>
</head>
<body>
    <div id="toast">🎯 请点击画面提取颜色</div>

    <div class="sidebar">
        <div class="header">
            <a href="../index.html" style="text-decoration:none; font-size:18px; margin-right:12px;">🏠</a>
            <h1 class="brand">切片幻影</h1>
            <span class="brand-tag">v2.7</span>
        </div>

        <div class="setting-card">
            <div class="card-title">🎭 大师风格预设</div>
            <div class="btn-group" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                <button class="btn btn-secondary" style="font-size:11px; padding:8px 2px;" onclick="applyPreset('matrix')">📟 矩阵</button>
                <button class="btn btn-secondary" style="font-size:11px; padding:8px 2px;" onclick="applyPreset('cyber')">🎆 赛博</button>
                <button class="btn btn-secondary" style="font-size:11px; padding:8px 2px;" onclick="applyPreset('magazine')">📖 杂志</button>
                <button class="btn btn-secondary" style="font-size:11px; padding:8px 2px;" onclick="applyPreset('vhs')">📼 录像</button>
                <button class="btn btn-secondary" style="font-size:11px; padding:8px 2px;" onclick="applyPreset('candy')">🍑 浪漫</button>
                <button class="btn btn-secondary" style="font-size:11px; padding:8px 2px;" onclick="applyPreset('nordic')">📽️ 电影</button>
            </div>
        </div>

        <div class="setting-card">
            <div class="card-title">🧪 实验室特效</div>
            <input type="file" id="imageUpload" accept="image/*" style="font-size: 11px;">
            <label>形态随机性 <span id="sizeVarVal">50</span>%</label>
            <input type="range" id="sizeVar" min="0" max="100" value="50">
            <label>色散重影 (RGB Split) <span id="rgbSplitVal">0</span>px</label>
            <input type="range" id="rgbSplit" min="0" max="25" value="0">
            <label>扫描线强度 <span id="scanlinesVal">0</span>%</label>
            <input type="range" id="scanlines" min="0" max="100" value="0">
            <label>不规则卡顿强度 <span id="stutterVal">30</span>%</label>
            <input type="range" id="stutter" min="0" max="100" value="30">
            <label style="cursor:pointer; font-size:11px; margin-top:8px; display:block;"><input type="checkbox" id="pixelDrift" checked> 开启水平撕裂位移</label>
        </div>

        <div class="setting-card">
            <div class="card-title">🎨 色彩自定义</div>
            <label>色块占比 <span id="colorCountVal">15</span></label>
            <input type="range" id="colorCount" min="0" max="60" value="15">
            <div class="color-palette" id="customPalette">
                <button class="btn-eyedropper" id="pickColor" title="吸管提取图片颜色">🎯</button>
                <button id="addColorBtn" style="border:2px dashed #cbd5e1; background:white; border-radius:50%; width:34px; height:34px; cursor:pointer;">+</button>
            </div>
        </div>

        <div class="setting-card">
            <div class="card-title">✍️ 自定义文字</div>
            <input type="text" id="overlayText" value="OHH BOX" placeholder="输入文字...">
            <div style="display:flex; gap:10px; margin-top:5px;">
                <div style="flex:1;"><label>字号 <span id="textSizeVal">80</span></label><input type="range" id="textSize" min="20" max="200" value="80"></div>
                <div style="width:50px;"><label>颜色</label><input type="color" id="textColor" value="#ffffff" style="width:100%; height:32px; border:none; border-radius:6px; background:none; cursor:pointer;"></div>
            </div>
            <label>位置 (X: <span id="textXVal">50</span>% | Y: <span id="textYVal">90</span>%)</label>
            <div style="display:flex; gap:10px;">
                <input type="range" id="textX" min="0" max="100" value="50">
                <input type="range" id="textY" min="0" max="100" value="90">
            </div>
        </div>

        <div class="setting-card" style="border-color:var(--accent); border-width:2px;">
            <button class="btn btn-primary" id="downloadPngBtn">📸 保存高清出图</button>
            <button class="btn btn-danger" id="recordBtn" style="margin-top: 8px;">🎥 导出 2.5s 实况视频</button>
        </div>
    </div>

    <div class="preview-area"><canvas id="mainCanvas"></canvas></div>

    <div id="wechat-mask" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; display:none; flex-direction:column; align-items:center; justify-content:center;" onclick="this.style.display='none'">
        <p style="color:white; margin-bottom:15px; font-weight:bold;">✨ 实况生成成功！请长按保存</p>
        <img id="wechat-img" style="max-width:90%; max-height:80%; border-radius:8px; box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);">
    </div>

    <script src="main.js?v=2.8"></script>
</body>
</html>
